name: Bioinformatics Docker Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'envs/Dockerfile.bioinformatics'    # the env's own Dockerfile
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'envs/Dockerfile.bioinformatics'
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        run: |
          REPO_NAME=${GITHUB_REPOSITORY##*/}
          ENV_NAME=$(basename envs/Dockerfile.bioinformatics)
          ENV_NAME=${ENV_NAME#Dockerfile.}
          echo "IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${REPO_NAME}-${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push docker containers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/Dockerfile.bioinformatics
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}:latest
            ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/scripts/prune_docker_tags.sh "${{ steps.meta.outputs.IMAGE }}" 5 "${{ steps.meta.outputs.SHORT_SHA }}"
